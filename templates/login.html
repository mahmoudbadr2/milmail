<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - MilMail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-['Cairo']">

    <div class="max-w-md w-full brand-card p-8 shadow-xl">
        <div class="text-center mb-6">
            <a href="/" class="inline-block mb-3">
                <img src="/static/logo.png" alt="MilMail Logo" class="h-24 w-auto mx-auto object-contain filter drop-shadow-sm">
            </a>
            <h2 class="text-2xl font-extrabold text-[#003038]">تسجيل الدخول</h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">أهلاً بك، تفضل بالدخول للوحة التحكم</p>
        </div>

        <!-- زر الدخول الرسمي عبر Google (نافذة حسابات جوجل المنبثقة) -->
        <div class="mb-6 flex flex-col items-center">
            <!-- حاوية زر جوجل الرسمي -->
            <div id="g_id_onload"
                 data-client_id="{{ settings.GOOGLE_CLIENT_ID or 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com' }}"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleGoogleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin w-full flex justify-center"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="center"
                 data-width="360">
            </div>

            <div class="relative flex py-4 items-center w-full">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-xs text-slate-400 font-bold">أو بالبريد الإلكتروني</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com" class="w-full brand-input text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full brand-input text-sm pl-10">
                    <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full brand-btn font-bold py-3.5 rounded-xl text-sm transition mt-2">
                تسجيل الدخول
            </button>
        </form>

        <p class="text-center text-xs text-slate-600 mt-6 font-medium">
            ليس لديك حساب بعد؟ <a href="/register" class="text-[#056676] font-bold hover:underline">أنشئ حساباً مجانياً</a>
        </p>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = `<svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>`;
            } else {
                input.type = "password";
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = 'جاري التحقق...';

            const formData = new FormData();
            formData.append('email', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.detail || 'فشل تسجيل الدخول');
                }
            } catch (err) {
                alert('حدث خطأ في الاتصال');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'تسجيل الدخول';
            }
        });

        // معالجة استجابة تسجيل الدخول الرسمية من نافذة Google المنبثقة
        async function handleGoogleCredentialResponse(response) {
            if (!response.credential) {
                alert("لم نتمكن من الحصول على بيانات الدخول من Google");
                return;
            }

            const formData = new FormData();
            formData.append('credential', response.credential);

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.detail || "فشل تسجيل الدخول عبر Google");
                }
            } catch (err) {
                alert("حدث خطأ في الاتصال بالخادم أثناء التحقق من Google");
            }
        }
    </script>
</body>
</html>
