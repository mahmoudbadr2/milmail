<!-- Ads Component: Displayed only for Free Tier users (Hidden for Pro Users) -->
{% if settings.ENABLE_ADS_FOR_FREE and (not user or not user.is_pro) %}
<div class="my-6 ad-slot-container max-w-4xl mx-auto shadow-sm">
    <span class="ad-badge">إعلان مدعوم</span>
    <div class="py-4 flex flex-col items-center justify-center min-h-[90px] text-gray-400 text-sm">
        <!-- Google AdSense Container -->
        <ins class="adsbygoogle"
             style="display:block; text-align:center;"
             data-ad-layout="in-article"
             data-ad-format="fluid"
             data-ad-client="{{ settings.ADSENSE_CLIENT_ID }}"
             data-ad-slot="1234567890"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
        <div class="flex items-center space-x-2 space-x-reverse text-xs text-indigo-500 font-medium mt-1">
            <span>مساحة إعلانية نشطة</span>
            <span>•</span>
            <a href="javascript:void(0)" onclick="upgradeToPro()" class="underline hover:text-indigo-700">ترقية إلى Pro لإزالة الإعلانات</a>
        </div>
    </div>
</div>
{% endif %}
